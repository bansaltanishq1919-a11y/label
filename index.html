<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Platform – what's really inside?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#17212f;--mute:#5d6b7e;--line:#dfe6ef;--brand:#1f5eff;--brand-soft:#e8efff;
--ok:#16803c;--ok-bg:#e5f6ea;--watch:#a65f00;--watch-bg:#fff2d9;--avoid:#c0262d;--avoid-bg:#fde8e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,"Noto Sans Devanagari",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:800}
.sub{color:var(--mute);margin:4px 0 12px}
.seg{display:inline-flex;background:#e6ecf5;border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;min-height:48px}
.btn.p{background:var(--brand);color:#fff}.btn.s{background:var(--brand-soft);color:var(--brand)}.btn.g{background:#eef2f7;color:var(--ink)}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}
.hint{color:var(--mute);font-size:14px;flex:1;min-width:200px}
#cam{position:fixed;inset:0;background:#000;z-index:9;display:none;flex-direction:column}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}#cam .bar{display:flex;gap:10px;justify-content:center;padding:14px}
.verdict{border-radius:16px;padding:18px;border:1px solid}
.verdict.ok{background:var(--ok-bg);border-color:#a8dcb8}.verdict.watch{background:var(--watch-bg);border-color:#f0cf8e}.verdict.avoid{background:var(--avoid-bg);border-color:#f0b4b6}
.verdict h2{margin:2px 0 6px;font-size:22px;line-height:1.25}.verdict p{margin:0}
.pname{font-size:13px;color:var(--mute);font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:#fff9;border:1px solid #0002}
h3{font-size:17px;margin:24px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kp{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kp li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.kp i{flex:none;width:12px;height:12px;border-radius:50%;margin-top:7px;background:var(--c)}
.step{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;font-size:14px;font-weight:600}
.step button{width:36px;height:36px;border:0;border-radius:9px;background:var(--brand-soft);color:var(--brand);font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.step span{min-width:64px;text-align:center}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.meter{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.meter .big{font-size:26px;font-weight:800;line-height:1.1}.meter .big small{font-size:14px;font-weight:600;color:var(--mute)}
.meter .lbl{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin:8px 0;min-height:14px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--c);display:block}
.track{position:relative;height:10px;border-radius:9px;background:#e8edf4}
.track b{display:block;height:100%;border-radius:9px;background:var(--c);max-width:100%}
.track u{position:absolute;right:0;top:-4px;bottom:-4px;border-right:2px solid var(--ink)}
.small{font-size:13px;color:var(--mute);margin-top:6px}
.mix{display:flex;height:10px;border-radius:9px;overflow:hidden;margin:4px 0 10px;background:#e8edf4}.mix b{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.lnk{border:0;background:none;color:var(--brand);margin-left:auto}
.ing{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin-top:8px}
.ing.ok{--c:#7cc795}.ing.watch{--c:#e8a62d}.ing.avoid{--c:var(--avoid)}
.ih{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto auto;gap:2px 10px;align-items:center;width:100%;padding:11px 14px;cursor:pointer}
.ih:focus-visible{outline:3px solid #7aa2ff;border-radius:12px}
.rank{color:var(--mute);font-weight:700;min-width:20px}
.iname{font-weight:700;font-size:16.5px}
.cat{grid-column:2/3;font-size:13.5px;color:var(--mute)}
.chev{transition:transform .15s;color:var(--mute);grid-row:1/3;grid-column:4}.ing.open .chev{transform:rotate(180deg)}
.pill{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;grid-row:1/3;grid-column:3}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.watch{background:var(--watch-bg);color:var(--watch)}.pill.avoid{background:var(--avoid-bg);color:var(--avoid)}
.ins{font-size:12px;background:#eef2f7;border-radius:6px;padding:1px 7px;font-weight:700;color:var(--mute);margin-left:4px}
.body{display:none;padding:0 14px 13px 44px}.ing.open .body{display:block}
.rows{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14.5px}
.rows dt{color:var(--mute);font-weight:700;white-space:nowrap}.rows dd{margin:0}
.ibar{height:6px;border-radius:6px;background:#e8edf4;margin:0 0 8px}.ibar b{display:block;height:100%;border-radius:6px;background:#8aa2c8}
.gl{display:grid;gap:8px}.gc{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:10px 14px}
.gc.watch{--c:#e8a62d}.gc.avoid{--c:var(--avoid)}.gc:focus-visible{outline:3px solid #7aa2ff}
.gc .pill{margin-left:8px}.gc .gs{display:block;color:var(--ink);font-size:14.5px;margin-top:3px}
ul.l{margin:0;padding-left:20px}
.foot{font-size:12.5px;color:var(--mute);margin-top:24px}
.err{background:var(--avoid-bg);color:var(--avoid);padding:12px 14px;border-radius:12px;font-weight:600;margin-top:14px}
.spin{display:flex;gap:12px;align-items:center;padding:26px;justify-content:center;color:var(--mute);font-weight:600}
.spin i{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:560px){.rows{grid-template-columns:1fr}.rows dt{margin-top:4px}.body{padding-left:14px}}
@media(prefers-reduced-motion:reduce){.spin i{animation-duration:3s}}

.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:#ffffffe8;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#1f5eff,#12b5a0);color:#fff;display:grid;place-items:center;font-size:15px}
main h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:18px 0 6px}
.panel{box-shadow:0 1px 2px #1f2f4a0f,0 6px 20px #1f2f4a0a}
.btn{border-radius:14px}.btn.p{box-shadow:0 4px 12px #1f5eff44}
.thumb{float:right;width:76px;height:76px;object-fit:cover;border-radius:14px;margin:0 0 6px 12px;border:2px solid #fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font:inherit;cursor:pointer;text-align:left;display:flex;align-items:baseline;gap:8px}
.tile b{font-size:26px;line-height:1;color:var(--c)}.tile span{font-weight:700;color:var(--mute)}
.tile.ok{--c:var(--ok)}.tile.watch{--c:#c27a00}.tile.avoid{--c:var(--avoid)}
.tile[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.tools input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#fff}
.pn{font-weight:600;color:var(--ink)}.cat{line-height:1.35}
.mini{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 11px 44px}.mini span{font-size:12.5px;background:#f1f4f9;border-radius:99px;padding:2px 9px;color:#33425a}
.ing.open .mini{display:none}.end{margin-top:22px}
@media(max-width:560px){.mini{padding-left:14px}main h1{font-size:25px}.tile b{font-size:22px}}

.hero{background:linear-gradient(135deg,#eaf1ff,#e4f7f2);border-color:#cfe0fb}
.hero .btn.p{min-height:56px;font-size:17px;padding:14px 26px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:4px}
.stp i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.stp span{color:var(--mute);font-size:14.5px}
.tags.big .tag{font-size:14px;padding:6px 14px;background:#fff}
#home[hidden]{display:none}


.warn{background:var(--watch-bg);color:#6b4100;border:1px solid #f0cf8e;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.freq{margin-top:10px;background:var(--brand-soft);border-radius:14px;padding:12px 14px}.freq b{display:block;color:var(--brand);font-size:13.5px}
.tag.nv.n4{background:var(--avoid-bg);color:var(--avoid)}.tag.nv.n3{background:var(--watch-bg);color:var(--watch)}.tag.nv.n1,.tag.nv.n2{background:var(--ok-bg);color:var(--ok)}
.nf{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 14px}.nf summary{cursor:pointer;font-weight:700;padding:10px 0}
.nf table{width:100%;border-collapse:collapse;margin-bottom:8px}.nf td{padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}.nf td:last-child{text-align:right;color:var(--mute);font-size:13px}
button.stp{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}button.stp:hover{border-color:var(--brand);transform:translateY(-2px)}
.dots i{animation:pop .35s both}@keyframes pop{from{transform:scale(0);opacity:0}}.track b{transition:width .3s}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;cursor:pointer}.ck input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin:1px 0 0}
.drag .hero{outline:3px dashed var(--brand);outline-offset:4px}
@media(prefers-reduced-motion:reduce){.dots i{animation:none}button.stp:hover{transform:none}.track b{transition:none}}
</style>
</head>
<body>
<div class="top"><div class="brand"><span class="logo">L</span>Label Platform</div><div class="seg" role="group" aria-label="Language" id="langs"></div></div>
<main>
<h1 id="t-title"></h1>
<p class="sub" id="t-sub"></p>
<section class="panel hero"><div class="actions">
  <button class="btn p" id="bCam"></button><button class="btn s" id="bUp"></button><button class="btn g" id="bSample"></button><span class="hint" id="t-drop"></span>
  <input type="file" id="file" accept="image/*" hidden></div></section>
<div id="home"></div>
<div id="out" aria-live="polite"></div>
<p class="foot" id="t-foot"></p>
</main>
<div id="cam"><video id="vid" playsinline muted></video><div class="bar"><button class="btn p" id="bSnap"></button><button class="btn g" id="bClose"></button></div></div>

  <div class="big">${big} <small>${unit}</small></div>${tsp?`<div class="dots">${'<i></i>'.repeat(n)}</div>`:''}
  <div class="track"><b style="width:${Math.min(pct,100)}%"></b><u></u></div><div class="small">${note}</div></div>`;
}

  if(num(n.sodiumMg)){const mg=n.sodiumMg*mult,g=mg*2.5/1000;m.push(meter(t.salt,+(g/6).toFixed(2),t.tsp,mg/LIM.n*100,g/6,`${Math.round(mg)} mg sodium = ${g.toFixed(1)} g`));}

  $('mt').innerHTML=m.join('');$('mv').textContent=mult+'×';nfUI();
